<!doctype html>
<html>
<head><meta charset="utf-8"><title>Analyst at Example Co (Lever-style test form)</title></head>
<body>
<div class="posting-header"><h2>Analyst</h2><div class="location">Toronto, ON</div></div>
<form method="POST" action="/submit" id="application-form">
  <h4>Submit your application</h4>
  <div class="application-question"><div class="application-label">Resume/CV<span class="required">✱</span></div>
    <div class="application-field"><input type="file" name="resume" id="resume-upload-input" style="opacity:0;width:1px;height:1px" required></div></div>
  <div class="application-question"><div class="application-label">Full name<span class="required">✱</span></div>
    <div class="application-field"><input type="text" name="name" required></div></div>
  <div class="application-question"><div class="application-label">Email<span class="required">✱</span></div>
    <div class="application-field"><input type="email" name="email" required></div></div>
  <div class="application-question"><div class="application-label">Phone</div>
    <div class="application-field"><input type="text" name="phone"></div></div>
  <div class="application-question"><div class="application-label">Current company</div>
    <div class="application-field"><input type="text" name="org"></div></div>
  <div class="application-question"><div class="application-label">LinkedIn URL</div>
    <div class="application-field"><input type="text" name="urls[LinkedIn]"></div></div>
  <div class="application-question"><div class="application-label">Are you legally authorized to work in Canada?<span class="required">✱</span></div>
    <div class="application-field"><select name="cards[a1][field0]" required><option value="">Select...</option><option>Yes</option><option>No</option></select></div></div>
  <div class="application-question"><div class="application-label">Will you now or in the future require sponsorship?<span class="required">✱</span></div>
    <div class="application-field"><ul data-qa="multiple-choice">
      <li><label><input type="radio" name="cards[a1][field1]" value="Yes" required><span>Yes</span></label></li>
      <li><label><input type="radio" name="cards[a1][field1]" value="No"><span>No</span></label></li></ul></div></div>
  <div class="application-question"><div class="application-label">Additional information</div>
    <div class="application-field"><textarea name="comments" placeholder="Add a cover letter or anything else you want to share."></textarea></div></div>
  <h4>U.S. Equal Employment Opportunity information</h4>
  <div class="application-question"><div class="application-label">Gender</div>
    <div class="application-field"><select name="eeo[gender]"><option value="">Select ...</option><option>Male</option><option>Female</option><option>Decline to self-identify</option></select></div></div>
  <div class="application-question"><div class="application-label">Race</div>
    <div class="application-field"><select name="eeo[race]"><option value="">Select ...</option><option>Asian</option><option>White</option><option>Decline to self-identify</option></select></div></div>
  <div class="application-question">
    <label><input type="checkbox" name="consent[store]" required> I agree to the storage of my personal information under the privacy policy<span class="required">✱</span></label></div>
  <button type="submit" class="template-btn-submit">Submit application</button>
</form>
</body>
</html>
